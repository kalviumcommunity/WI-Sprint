name: Deploy site to GitHub Pages

# Publishes web/ to GitHub Pages. Requires Pages to be enabled once, with
# Settings > Pages > Source set to "GitHub Actions" (needs repo admin).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    # Neither this workflow's GITHUB_TOKEN nor a non-admin PAT can create the
    # Pages site on this org ("Resource not accessible by integration"), so a
    # human with repo-admin has to switch it on once. Until then, say so
    # plainly and skip instead of failing red on every push.
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages not enabled::Skipping deploy. A repo admin must set Settings > Pages > Source to 'GitHub Actions', then re-run this workflow."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the site is self-contained
        run: |
          # The site must not fetch anything at runtime - it has to render
          # identically from file://, Pages, or any static host.
          if grep -rn "fetch(\|XMLHttpRequest" web/assets/js/; then
            echo "::error::Runtime network call found in web/assets/js - the site must stay self-contained."
            exit 1
          fi
          test -f web/index.html
          test -f web/assets/data/seed-data.js
          echo "OK: no runtime fetches, entry point and seed present."

      # enablement: true lets the workflow's own GITHUB_TOKEN (which carries
      # pages: write above) turn Pages on, so the first deploy does not need a
      # human with repo-admin to flip the setting by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
