<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inefficiency Insights · UtilizationIQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231d4ed8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="insights">
<div class="app-shell">
  <div id="sidenav"></div>
  <div class="main">
    <div id="topbar"></div>
    <div class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Inefficiency Insights</h1>
          <p class="page-subtitle">Computed findings, ranked by weekly cost impact. Every row traces to real hours and rates - no black box.</p>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="data-table" id="insights-table">
            <thead>
              <tr>
                <th data-key="type" data-type="text">Type</th>
                <th data-key="title" data-type="text">Finding</th>
                <th data-key="costImpact" class="is-num">Weekly cost impact</th>
                <th data-key="detectedDate" data-type="text">Detected</th>
                <th data-key="statusOrder" class="is-num">Status</th>
              </tr>
            </thead>
            <tbody id="insights-tbody">
              <tr><td colspan="5"><div class="skeleton" style="height:260px;"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/iq-data.js"></script>
<script src="assets/js/iq-charts.js"></script>
<script src="assets/js/iq-table.js"></script>
<script src="assets/js/iq-findings.js"></script>
<script src="assets/js/iq-shell.js"></script>
<script src="assets/js/page-insights.js"></script>
</body>
</html>
