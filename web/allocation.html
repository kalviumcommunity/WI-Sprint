<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Allocation · UtilizationIQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231d4ed8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="allocation">
<div class="app-shell">
  <div id="sidenav"></div>
  <div class="main">
    <div id="topbar"></div>
    <div class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Project Allocation</h1>
          <p class="page-subtitle">Planned vs. actual staffing per project. Click a row to see who's assigned.</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="table-wrap">
          <table class="data-table" id="alloc-table">
            <thead>
              <tr>
                <th data-key="name" data-type="text">Project</th>
                <th data-key="client" data-type="text">Client</th>
                <th data-key="department" data-type="text">Department</th>
                <th data-key="headcount" class="is-num">Headcount</th>
                <th data-key="planned" class="is-num">Planned %</th>
                <th data-key="actual" class="is-num">Actual %</th>
                <th data-key="gap" class="is-num">Gap</th>
                <th data-key="statusRank" class="is-num">Status</th>
                <th data-key="start_date" data-type="text">Start</th>
                <th data-key="end_date" data-type="text">End</th>
              </tr>
            </thead>
            <tbody id="alloc-tbody">
              <tr><td colspan="10"><div class="skeleton" style="height:220px;"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 class="card__title">On the bench (0% allocated)</h2>
        <div class="table-wrap">
          <table class="data-table" id="bench-table">
            <thead>
              <tr>
                <th data-key="name" data-type="text">Name</th>
                <th data-key="role" data-type="text">Role</th>
                <th data-key="department" data-type="text">Department</th>
                <th data-key="hourly_rate" class="is-num">Rate/hr</th>
              </tr>
            </thead>
            <tbody id="bench-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/iq-data.js"></script>
<script src="assets/js/iq-charts.js"></script>
<script src="assets/js/iq-table.js"></script>
<script src="assets/js/iq-findings.js"></script>
<script src="assets/js/iq-shell.js"></script>
<script src="assets/js/page-allocation.js"></script>
</body>
</html>
