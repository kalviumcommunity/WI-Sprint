<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Utilization Breakdown · UtilizationIQ</title>
<meta name="description" content="Per-consultant billable vs non-billable split and utilization against target." />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23fff' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("iq.theme.v1");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app">
  <aside id="nav"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="content" id="main">
      <div class="page-head">
        <div>
          <div class="page-eyebrow">Utilization</div>
          <h1 class="page-title">Consultant breakdown</h1>
          <p class="page-sub">Every consultant in scope, with the billable / non-billable split behind their number.</p>
        </div>
        <div class="topbar__group">
          <div class="seg" id="group-toggle" role="group" aria-label="Group rows by">
            <button type="button" data-group="department" class="is-active">By department</button>
            <button type="button" data-group="project">By project</button>
          </div>
          <button class="btn btn--ghost" id="export">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8v8.4M4.8 7l3.2 3.2L11.2 7M2.4 13.2h11.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export CSV
          </button>
        </div>
      </div>

      <section class="card card--flush">
        <div class="table-scroll">
          <table class="tbl" id="tbl">
            <thead>
              <tr>
                <th data-key="name" data-type="text">Consultant</th>
                <th data-key="department" data-type="text">Department</th>
                <th data-key="projectLabel" data-type="text">Project</th>
                <th data-key="billable" class="r">Billable</th>
                <th data-key="non_billable" class="r">Non-bill.</th>
                <th data-key="available" class="r">Available</th>
                <th class="r">Split</th>
                <th data-key="utilization_pct" class="r">Utilization</th>
                <th data-key="statusRank" class="r">Status</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="9"><div class="sk" style="height:280px"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="assets/data/seed-data.js"></script>
<script src="assets/js/iq-data.js"></script>
<script src="assets/js/iq-charts.js"></script>
<script src="assets/js/iq-table.js"></script>
<script src="assets/js/iq-findings.js"></script>
<script src="assets/js/iq-shell.js"></script>
<script src="assets/js/page-utilization.js"></script>
</body>
</html>
